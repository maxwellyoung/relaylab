name: verify

on:
  push:
    branches: [main, group-review-workflow]
  pull_request:

permissions:
  contents: read

jobs:
  gate:
    name: tests, types, builds, smoke, audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run verify

  mysql:
    name: adapter against a real MySQL 8.4
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: ci-root
          MYSQL_DATABASE: relaylab_ci
        ports: ["3306:3306"]
        options: >-
          --health-cmd "mysqladmin ping -h 127.0.0.1 -pci-root"
          --health-interval 5s --health-timeout 5s --health-retries 20
    env:
      RELAYLAB_DATABASE_DRIVER: mysql
      RELAYLAB_DB_HOST: 127.0.0.1
      RELAYLAB_DB_PORT: "3306"
      RELAYLAB_DB_NAME: relaylab_ci
      RELAYLAB_DB_USER: root
      RELAYLAB_DB_PASSWORD: ci-root
      RELAYLAB_DB_SSL: "false"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run test -w server -- mysql-live

  android:
    name: native Android units, builds and lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Install pinned SDK platform and build tools
        run: '"$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-35" "build-tools;34.0.0"'
      - run: ./android/gradlew -p android :app:testDebugUnitTest :app:assembleDebug :app:lintDebug :app:assembleRelease :app:lintRelease --no-daemon --console=plain
